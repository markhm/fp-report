# fp-report.conf — per-project settings for the shared fp-report tool.
# Copy this into a project's scripts/ dir and edit. Sourced as bash: KEY="value".
# Relative paths below resolve against THIS FILE's directory.

# fp issue short-id prefix — must match the project's .fp/config.toml `prefix`.
# Issue IDs render as "<FP_PREFIX>-<shortId>".
FP_PREFIX="FP"

# Human-readable project name — logo alt text (and the fallback app name).
PROJECT_NAME="project"

# Application/product name shown in the browser <title>. Empty → falls back to PROJECT_NAME.
APP_NAME=""

# Heading shown on the report page (on-page <h1>). No "fp" needed.
REPORT_TITLE="Roadmap & prioritisation"

# Status registry (labels, colours, open/done/rejected roles) — mirror the project's
# .fp/extensions/workflow.ts. Relative → resolved against this conf's dir.
STATUS_FILE="fp-report.status.json"

# Theme taxonomy for the Themes tiles page — the facets (Quality / Area / Work type),
# their colours, and the keyword rules used to infer a theme when an issue carries no
# fp label. Mirror the project's .fp/extensions/labels vocabulary so inferred themes
# converge on real labels. Relative → resolved against this conf's dir.
THEMES_FILE="fp-report.themes.json"

# Properties (labels, workstation, rank). fp 0.25 returns them from 'fp issue list', so
# this needs no extra calls. An older fp left them out of the list; for exactly those issues
# the engine falls back to one 'fp issue show' each, cached by updatedAt so only changed
# issues are fetched again. FETCH_LABELS="false" skips that fallback (an older fp then has
# no labels, and themes come from keywords only).
FETCH_LABELS="true"
# LABEL_CACHE=""    # older fp: default OUTPUT_DIR/.fp-report.labels.json — derived, don't commit it
# LABEL_JOBS="12"   # older fp: parallel 'fp issue show' calls

# History. The Trends tab replays 'fp log' — every status transition, creation and
# deletion the project recorded — to reconstruct how many issues sat in each status on
# every past day. The issue list alone can't do this: it is a snapshot, so any trend
# drawn from it would just assume each issue held its current status since createdAt.
# One extra 'fp log' call per run (~0.5s on a 1000-issue project). Set "false" to skip
# it; the Trends tab then removes itself and the rest of the report is unaffected.
FETCH_HISTORY="true"
# HISTORY_LIMIT="200000"   # 'fp log --limit' — big enough to mean "the whole project"

# Which tabs to build. Unset (the default) = all of them. Space- or comma-separated,
# case-insensitive. Valid names: Focus Signals Themes Roadmap Epics Issues Orphans Trends Flow.
# Excluded tabs are hidden and the first surviving tab becomes the landing page. Dropping
# BOTH Trends and Flow also skips the 'fp log' call and its embedded event payload (~97KB
# raw / 24KB gzipped on a 1000-issue project, plus ~0.5s). Excluding any other tab saves
# only its hidden markup — page weight is dominated by the issue JSON every tab shares.
# REPORTS_INCLUDED="Focus Signals Themes Roadmap Epics Issues Orphans Trends Flow"

# Signal thresholds (Focus + Signals tabs, KPI strip). Whole numbers; anything else aborts.
# CRITICAL_BUDGET=5      # open critical issues (epics included) before "critical" is flagged as inflated
# URGENT_IDLE_DAYS=30    # a critical/high work item untouched this long is flagged
# CLAIM_IDLE_DAYS=7      # an in-progress issue untouched this long has a stale claim
# Children whose title matches this (case-insensitive) are reviews of their parent, not its
# scope: they do not make the parent an epic, and a finished review does not finish it.
# Empty switches the exclusion off. The pattern runs in the BROWSER (JavaScript RegExp,
# case-insensitive), so it is validated in that dialect: by node when node is on PATH, else
# by a Python compile that also refuses '(?…' flags/groups. Python anchors (\A \Z \z) are
# always refused: JavaScript reads them as plain letters. Anything invalid aborts.
# REVIEW_TITLE_RE='^code review\b'

# Roadmap tab: open epics in theme lanes, ordered by hard dependencies, then rank, then
# priority, then status. RANK_PROPERTY names the fp property that holds each epic's rank;
# register it as a text property (fp.ui.properties.text()) in the project's fp extensions.
# Unset → no rank: the order is dependencies, priority and status, and reordering is off.
# A local build lets you drag blocks and copy the 'fp issue update' commands that make the
# new order real; a --publish build (fp-report-deploy) leaves that code out entirely.
# RANK_PROPERTY="rank"
# ROADMAP_EXCLUDE=""     # epic IDs (with or without the prefix) kept off the lanes, e.g. a "Bugs" bucket

# Theme (colour palette + background, light & dark). A raw CSS file of custom properties
# for :root (light) and dark. Copy the tool's default and edit the hex values to rebrand.
# Relative → resolved against this conf's dir. Missing → the tool's neutral default.
THEME_FILE="fp-report.theme.css"

# Brand logos. Relative → resolved against ASSETS_DIR (defaults to OUTPUT_DIR).
# LOGO_LIGHT = dark wordmark for the light theme; LOGO_DARK = light wordmark for dark.
# Missing files fall back to the tool's neutral defaults.
LOGO_LIGHT="fp-report.logo-light.svg"
LOGO_DARK="fp-report.logo-dark.svg"

# Where the generated HTML is written, and where logos live. Relative → resolved
# against this conf's dir. Default (empty) = the sibling ../reports dir.
OUTPUT_DIR=""
OUTPUT_FILE="fp-report.html"
# ASSETS_DIR=""     # override only if logos live somewhere other than OUTPUT_DIR

# ---- Deployment (fp-report-deploy.sh) ----
# Publishing target for `fp-report-deploy`. It regenerates the report straight into a
# static-site repo's served directory, commits, and pushes — a git-triggered host
# (CloudFlare Pages, Netlify, GitHub Pages) then redeploys. There is no build step and
# NO SECRETS: pushing uses your existing git credentials, and `gh` (if installed) is only
# used to create the remote repo on first run. Leave these unset if you don't publish.
#
# DEPLOY_REPO="../my-report-site"   # local checkout of the publishing repo (abs, or rel. to this conf)
# DEPLOY_SUBDIR="src"               # served directory inside it — the report lands here
# DEPLOY_BRANCH="master"            # branch the host deploys from
# DEPLOY_REMOTE=""                  # origin to add/create on first run; blank → commit locally, don't push
